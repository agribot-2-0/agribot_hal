image: docker:18-git

pipelines:
  default:
     - step:
         name: "ROS Build"
         services:
           - docker
         script:
           - apk add --update bash coreutils tar
           - ./pull_submodules.sh
           - git clone --quiet --depth 1 https://github.com/ros-industrial/industrial_ci .industrial_ci -b master
           - git clone https://github.com/panpawelchmiel/agribot_msgs.git
           - git clone https://github.com/panpawelchmiel/agribot_common.git
           - git clone https://github.com/panpawelchmiel/agribot_drivers.git
           - cp agribot_drivers/io_card/prebuilt/* hal_iocard/
           - .industrial_ci/bitbucket.sh BUILDER="colcon" ROS_DISTRO=melodic

definitions:
  services:
    docker:
      memory: 3072
